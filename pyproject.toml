[project]
name = "span"
version = "2.1.0"
description = "Span Panel Custom Integration for Home Assistant"
authors = [{name = "SpanPanel"}]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.14.3,<3.15"
dependencies = [
    "homeassistant==2026.8.0",
    "span-panel-api==3.0.0b6",
    # Separate distributions, not dependencies of the bootstrap: adapters are found
    # through the `span_panel_api.schema_adapters` entry-point group, so each one has
    # to be installed for discovery to see it. manifest.json carries the same three,
    # and that is the list Home Assistant actually reads.
    "span-panel-api-schema-0==1.0.0b5",
    "span-panel-api-schema-1==0.1.0b6",
]

[dependency-groups]
dev = [
    "homeassistant-stubs==2026.8.0",
    "types-requests",
    "types-PyYAML",
    "mypy==1.20.2",
    "pyright==1.1.409",
    "ruff==0.15.12",
    "bandit[toml]==1.9.4",
    "prek>=0.3.11",
    "voluptuous-stubs",
    "python-direnv",
    "prettier",
    "radon==6.0.1",
    "pylint==4.0.5",
    # Pinned, not floored: each release pins one exact Home Assistant, so this
    # and the `homeassistant` pin above are a single choice rather than two.
    # 0.13.354 is the release that pins 2026.8.0, the version this integration
    # declares as its floor and therefore the one worth testing against.
    "pytest-homeassistant-custom-component==0.13.354",
    "isort",
    "vulture>=2.14",
]

[tool.uv]
package = false

[tool.uv.sources]
# This branch develops against the in-progress schema-1 adapter, which lives in a
# worktree rather than the primary checkout the symlink points at. `-p3` carries
# the library half of `feat/discovery-and-catalog-validation`; the two halves are
# one change and pointing at the wrong worktree means the branch is not being
# tested against the library it needs.
span-panel-api = { path = "../../span/span-panel-api-p3", editable = true }
span-panel-api-schema-0 = { path = "../../span/span-panel-api-p3/packages/schema-0", editable = true }
span-panel-api-schema-1 = { path = "../../span/span-panel-api-p3/packages/schema-1", editable = true }

[tool.jscpd]
path = ["custom_components/span_panel", "./*.{html,md}"]
format = ["python", "javascript", "json", "markup", "markdown"]
ignore = "custom_components/span_panel/translations/**|**/translations/**|.github/**|env/**|**/site-packages/**|**/.direnv/**"
reporters = ["console"]
output = "./jscpdReport"
gitignore = true

[tool.mypy]
platform = "linux"
show_error_codes = true
follow_imports = "normal"

# Type checking settings
strict_equality = true
no_implicit_optional = true
warn_incomplete_stub = true
warn_redundant_casts = true
warn_unused_configs = true
local_partial_types = true
check_untyped_defs = true
disallow_incomplete_defs = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_decorators = true
warn_return_any = true
strict_optional = true

# Package handling for HA custom integration
mypy_path = "."
namespace_packages = false
explicit_package_bases = false

# Module search paths - set this explicitly to prevent duplicate module resolution
files = ["custom_components/span_panel"]

# Exclude patterns
exclude = [
    "venv/.*",
    ".venv/.*",
    "scripts/.*"
]

# Error codes
enable_error_code = [
    "deprecated",
    "ignore-without-code",
    "redundant-self",
    "truthy-iterable",
    "mutable-override"
]
disable_error_code = [
    "annotation-unchecked",
    "import-not-found",
    "import-untyped",
    "override",
    "misc",
]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
warn_untyped_fields = true

[tool.pyright]
include = ["custom_components/span_panel"]
exclude = [
    "venv",
    ".venv",
    "scripts",
    ".git",
    ".pytest_cache",
    ".mypy_cache",
    ".ruff_cache", "**/node_modules", "**/__pycache__", "**/.*"
]
extraPaths = [
    "./custom_components",
    "../../span/span-panel-api-p3/src",
    "../ha-synthetic-sensors/src"
]
pythonPlatform = "Darwin"
pythonVersion = "3.14"
typeCheckingMode = "basic"
useLibraryCodeForTypes = true
autoImportCompletions = true
reportMissingImports = "warning"
reportMissingTypeStubs = false
venvPath = "."
venv = ".venv"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = [
    "B007", # Loop control variable {name} not used within loop body
    "B014", # Exception handler is an `except` clause that only reraises
    "C",  # complexity
    "D",  # docstrings
    "E",  # pycodestyle (includes E402 - module level import not at top of file)
    "F",  # pyflakes/autoflake
    "I",  # isort - import sorting and organization
    "ICN001", # import concentions; {name} should be imported as {asname}
    "PGH004",  # Use specific rule codes when using noqa
    "PLC0414", # Useless import alias. Import alias does not rename original package.
    "SIM105", # Use contextlib.suppress({exception}) instead of try-except-pass
    "SIM117", # Combine multiple with statements
    "SIM118", # Use {key} in {dict} instead of {key} in {dict}.keys()
    "SIM201", # Use {left} != {right} instead of not {left} == {right}
    "SIM212", # Use {a} if {a} else {b} instead of {b} if not {a} else {a}
    "SIM300", # Yoda conditions. Use 'age == 42' instead of '42 == age'.
    "SIM401", # Use get from dict with default instead of conditional assignment
    "T20",  # flake8-print
    "TID",  # flake8-tidy-imports - import organization and toplevel checking
    "TRY004", # Prefer TypeError exception for invalid type
    "RUF006", # Store a reference to the return value of asyncio.create_task
    "UP",  # pyupgrade
    "W",  # pycodestyle
]

ignore = [
    "D202",  # No blank lines allowed after function docstring
    "D203",  # 1 blank line required before class docstring
    "D213",  # Multi-line docstring summary should start at the second line
    "D406",  # Section name should end with a newline
    "D407",  # Section name underlining
    "E501",  # line too long
    "E731",  # do not assign a lambda expression, use a def
]

# Per-file ignores for test and debug files
[tool.ruff.lint.per-file-ignores]
"test_*.py" = ["T201", "D103", "D100", "E402", "TID252"]  # Allow print statements, missing docstrings, and imports inside functions in test files
"debug_*.py" = ["T201", "D103", "D100", "E402", "TID252"]  # Allow print statements, missing docstrings, and imports inside functions in debug files
"tests/**/*.py" = ["T201", "D103", "D100", "E402", "TID252"]  # Allow print statements, missing docstrings, and imports inside functions in test directory

# Bandit configuration
[tool.bandit]
exclude_dirs = ["tests", "scripts"]
skips = ["B101", "B108"]  # Skip assert_used and hardcoded_tmp_directory for test files

[tool.ruff.lint.flake8-pytest-style]
fixture-parentheses = false

[tool.ruff.lint.pyupgrade]
keep-runtime-typing = true

[tool.ruff.lint.mccabe]
max-complexity = 25

[tool.ruff.format]
# Ruff is the primary formatter
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint.isort]
known-first-party = ["custom_components", "span"]
force-sort-within-sections = true
combine-as-imports = true

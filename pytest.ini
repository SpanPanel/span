[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
filterwarnings =
    ignore::pytest.PytestDeprecationWarning
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
testpaths = tests
# `-p no:respx`: importing Home Assistant aliases `httpx` to `httpx2`, and refuses
# to once something has imported `httpx` itself, which respx's own pytest plugin
# would do first. The harness still uses respx directly; only its plugin is off.
addopts = -v --tb=short --strict-markers -p no:respx
python_files = test_*.py
python_classes = Test*
python_functions = test_*
strict_markers = true
markers =
    asyncio: marks tests as async
    slow: marks tests as slow (deselect with '-m "not slow"')
    spec_only: pins behaviour the eBus catalog specifies and no reference capture exercises
    unlinked_issues_allowed: raises span_panel issues with no config entry on purpose, as code from before issues were linked to their entry did
# `scripts` for the scripts their tests import by name, such as `ha_beta_pins`.
pythonpath = . scripts
norecursedirs = tests/scripts

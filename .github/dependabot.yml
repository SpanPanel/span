version: 2
updates:
  # Python dependencies managed by uv
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 1
    allow:
      - dependency-type: "all"
    groups:
      # Group development dependencies together
      dev-dependencies:
        patterns:
          - "pytest*"
          - "mypy"
          - "ruff"
          - "bandit"
          - "prek"
          - "isort"
          - "pylint"
          - "radon"
          - "prettier"
          - "python-direnv"
          - "*-cov"
          - "types-*"
          - "voluptuous-stubs"
          - "pyright"
    reviewers:
      - "cayossarian"
    assignees:
      - "cayossarian"
    commit-message:
      prefix: "deps"
      include: "scope"
    labels:
      - "dependencies"
      - "python"
    ignore:
      # Bumped by hand with each integration release, together with
      # manifest.json, so the manifest and the pip pins never drift.
      - dependency-name: "span-panel-api"
      - dependency-name: "span-panel-api-schema-0"
      - dependency-name: "span-panel-api-schema-1"
      # Bumped by hand as a pair, as in #281: each harness release pins one
      # exact Home Assistant, often a beta, so the harness moves only to the
      # release that pins the `homeassistant` version chosen. `homeassistant`
      # is ignored too, because bumping it alone breaks the same pairing.
      - dependency-name: "pytest-homeassistant-custom-component"
      - dependency-name: "homeassistant"

  # GitHub Actions dependencies
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 1
    reviewers:
      - "cayossarian"
    assignees:
      - "cayossarian"
    commit-message:
      prefix: "ci"
      include: "scope"
    labels:
      - "dependencies"
      - "github-actions"
